<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
    <!-- Nhúng Bootstrap CSS từ CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow border-0 rounded-4 p-4 p-md-5 bg-white">
                    
                    <!-- Tiêu đề Form -->
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Tạo Tài Khoản Mới</h2>
                        <p class="text-muted small">Vui lòng điền đầy đủ thông tin bên dưới để đăng ký</p>
                    </div>

                    <!-- Form đăng ký -->
                    <form>
                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label for="fullname" class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên của bạn" required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                        </div>

                        <!-- Xác nhận mật khẩu -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                        </div>

                        <!-- Giới tính (Radio button) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Giới tính</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="male" value="male" checked>
                                <label class="form-check-label" for="male">Nam</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                                <label class="form-check-label" for="female">Nữ</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="other" value="other">
                                <label class="form-check-label" for="other">Khác</label>
                            </div>
                        </div>

                        <!-- Sở thích (Checkbox) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Sở thích</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                <label class="form-check-label" for="hobbySports">Thể thao</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                            </div>
                        </div>

                        <!-- Quốc gia (Dropdown Select) -->
                        <div class="mb-4">
                            <label for="country" class="form-label fw-semibold">Quốc gia</label>
                            <select class="form-select" id="country" required>
                                <option selected disabled value="">Chọn quốc gia</option>
                                <option value="vn">Việt Nam</option>
                                <option value="us">Hoa Kỳ</option>
                                <option value="jp">Nhật Bản</option>
                                <option value="kr">Hàn Quốc</option>
                            </select>
                        </div>

                        <!-- Nút Submit -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">Đăng Ký</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap JavaScript Bundle từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
